# Backend runtime settings. Spring Boot reads this file when the application starts.
# Name used to identify this backend in Spring logs and configuration.
spring.application.name=sales-order-backend
# HTTP port for the backend API: http://localhost:8080.
server.port=8080

# PostgreSQL connection for the lanka_sales database.
# The database is managed by the local PostgreSQL server on port 5432.
# Database schema changes are managed by Hibernate during startup.
spring.datasource.url=jdbc:postgresql://localhost:5432/lanka_sales
# JDBC driver class used to talk to PostgreSQL.
spring.datasource.driverClassName=org.postgresql.Driver
# Database account name used by the backend and matching PostgreSQL console connection.
spring.datasource.username=lanka_app
# Password for lanka_app; it must match the PostgreSQL role credentials.
spring.datasource.password=${DB_PASSWORD:}

# Ask Hibernate to update the schema to match entity mappings during startup.
spring.jpa.hibernate.ddl-auto=update
# Do not keep an entity manager open for the entire HTTP response-rendering phase.
spring.jpa.open-in-view=false
# false keeps Hibernate SQL statements out of the normal console output.
spring.jpa.show-sql=false


# Include an error message in standard error responses so the frontend can explain failures.
server.error.include-message=always
# Limit each file in a multipart upload. The current frontend sends base64 JSON, not multipart.
spring.servlet.multipart.max-file-size=25MB
# Limit the complete multipart request; this does not cap base64 JSON request bodies.
spring.servlet.multipart.max-request-size=30MB

# Adopt the existing database at version 0, then migrate its sales-order primary key safely.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Optional private settings for this laptop; the file is excluded from Git.
spring.config.import=optional:file:./application-local.properties
